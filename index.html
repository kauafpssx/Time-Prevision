<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Tempo em Porto Alegre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="src/presentation/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><span class="eyebrow">PREVISÃO LOCAL</span><h1>Porto Alegre <span>RS</span></h1></div>
      <div class="updated" id="updated">Carregando dados…</div>
    </header>

    <section class="hero" id="hero" aria-live="polite">
      <div class="hero-copy"><p>Hoje</p><h2>--°</h2><strong>Carregando previsão</strong></div>
    </section>

    <section class="section">
      <div class="section-title"><div><span class="eyebrow">PRÓXIMAS HORAS</span><h2>Ao longo do dia</h2></div></div>
      <div class="hourly" id="hourly"></div>
    </section>

    <section class="section">
      <div class="section-title"><div><span class="eyebrow">TENDÊNCIA</span><h2>Próximos 7 dias</h2></div><button id="showAll">Ver 30 dias</button></div>
      <div class="forecast-list" id="daily"></div>
    </section>

    <footer>Previsão experimental gerada por modelo de machine learning e dados Open-Meteo.</footer>
  </main>
</body>
</html>
