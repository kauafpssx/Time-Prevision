name: Atualizar previsão

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Atualizar dados meteorológicos
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m time_prevision.infrastructure.database.update_database
      - name: Gerar previsão do site
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m time_prevision.interfaces.cli.export_forecast --dias 30
      - name: Publicar branch frontend
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: frontend
          publish_dir: ./frontend
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: atualizar previsão diária"
