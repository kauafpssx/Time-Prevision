name: Atualizar previsão

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      TIME_PREVISION_N_JOBS: "4"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Atualizar dados meteorológicos
        working-directory: backend
        run: python -m time_prevision.infrastructure.database.update_database
      - name: Treinar modelo com dados atualizados
        working-directory: backend
        run: python -m time_prevision.infrastructure.ml.train_model
      - name: Gerar previsão do site
        working-directory: backend
        run: python -m time_prevision.interfaces.cli.export_forecast --dias 30
      - name: Validar JSON publicado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("frontend/data/forecast.json").read_text(encoding="utf-8"))
          assert len(data["daily"]) == 30
          assert len(data["hourly"]) == 24
          assert len(data["model"]["outputs"]) == 8
          assert data["model"]["metrics"]
          print("JSON validado com 30 dias, 24 horas, 8 outputs e métricas.")
          PY
      - name: Publicar branch frontend
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: frontend
          publish_dir: ./frontend
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: atualizar previsão diária"
