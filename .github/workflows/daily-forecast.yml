name: Atualizar previsão

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      TIME_PREVISION_N_JOBS: "4"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Preparar branch do frontend
        run: |
          git fetch origin frontend:frontend
          git worktree add ../frontend-site frontend
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt
      - name: Atualizar dados meteorológicos
        working-directory: backend
        run: python -m time_prevision.infrastructure.database.update_database
      - name: Treinar modelo com dados atualizados
        working-directory: backend
        run: python -m time_prevision.infrastructure.ml.train_model
      - name: Gerar previsão do site
        working-directory: backend
        run: python -m time_prevision.interfaces.cli.export_forecast --dias 30 --output ../../frontend-site/data/forecast.json
      - name: Validar JSON publicado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("../frontend-site/data/forecast.json").read_text(encoding="utf-8"))
          assert len(data["daily"]) == 30
          assert len(data["hourly"]) == 24
          assert len(data["model"]["outputs"]) == 8
          assert data["model"]["metrics"]
          assert all("rainThreshold" in day and "confidence" in day for day in data["daily"])
          assert data["daily"][16]["forecastMode"] == "tendencia_climatica"
          rain_metrics = data["model"]["metrics"]["precipitacao_mm"]
          assert all("brier_calibrado" in values for values in rain_metrics.values())
          print("JSON validado com 30 dias, 24 horas, 8 outputs e métricas.")
          PY
      - name: Atualizar somente o JSON na branch frontend
        run: |
          git -C ../frontend-site config user.name "github-actions[bot]"
          git -C ../frontend-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../frontend-site add data/forecast.json
          if git -C ../frontend-site diff --cached --quiet; then
            echo "O JSON não mudou; nada para publicar."
          else
            git -C ../frontend-site commit -m "chore: atualizar previsão diária"
            git -C ../frontend-site push origin frontend
          fi
